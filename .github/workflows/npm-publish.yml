# On 문서 내 PC 판(npm on-munseo-local)을 npm 에 올리는 일 — 신뢰하는 게시처(trusted publishing, GitHub OIDC)·출처 증명(provenance) (2026-11-27 준비)
# · 사람이 Actions 화면에서 「Run workflow」를 눌러야만 돎(workflow_dispatch). push·태그만으로는 올리지 않음. 기본은 검사만(mode=check)
# · 꾸러미는 이 워크플로가 만들지 않는다 — 엔진·서버 코드가 비공개라 꾸러미는 만든 이의 맥에서 만들어 이 저장소의 릴리스(v<판>)에 붙인다.
#   이 워크플로는 그 릴리스의 tgz 를 받아 지문(SHA-256)을 세 곳(사람이 넣은 값 · 릴리스의 SHA256SUMS · 본 저장소 SHA256SUMS)과 맞대 보고, 꾸러미 이름·판·저장소 칸을 확인한 뒤 올린다.
#   그래서 npm 의 출처 증명은 「이 저장소의 이 커밋에서 이 워크플로가 이 지문의 파일을 올렸다」를 증명하고, 소스에서 빌드했다는 것은 증명하지 않는다(README 「믿을 근거」에 그대로 적음)
# · 비밀값(NPM_TOKEN) 없음 — npmjs.com 의 on-munseo-local 설정 → Trusted Publisher 에 이 저장소·이 파일 이름(npm-publish.yml)·환경 이름(npm)을 적어 둔 뒤에만 올라감
# · mode=stage 면 npm 의 단계 게시(npm stage publish) — 올린 판은 사람이 npmjs.com 에서 2단계 인증으로 승인해야 공개됨(권장)
name: npm publish (provenance)
on:
  workflow_dispatch:
    inputs:
      version:
        description: "올릴 판 (예: 0.2.2) — 릴리스 v<판> 에 on-munseo-local-<판>.tgz 가 붙어 있어야 함"
        required: true
      sha256:
        description: "맥에서 만든 on-munseo-local-<판>.tgz 의 SHA-256 (shasum -a 256 로 센 64자)"
        required: true
      mode:
        description: "check(검사만·기본) | stage(단계 게시 — 사람이 npm 에서 승인) | publish(바로 공개)"
        required: true
        default: check
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest        # 신뢰하는 게시처·출처 증명은 GitHub 가 띄우는 러너에서만 됨(자체 러너 안 됨)
    environment: npm              # npmjs.com Trusted Publisher 의 Environment name 과 같게 — 저장소 설정에서 승인자를 걸 수 있음
    permissions:
      contents: read
      id-token: write             # OIDC — npm 이 이 워크플로를 알아보는 데 씀(비밀값 대신)
    env:
      PKG: on-munseo-local
      VERSION: ${{ inputs.version }}
      WANT_SHA: ${{ inputs.sha256 }}
      MODE: ${{ inputs.mode }}
    steps:
      - name: Check inputs
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "판은 1.2.3 꼴로"; exit 1; }
          [[ "$VERSION" != *-local.* ]] || { echo "시험 판(…-local.커밋)은 올리지 않음"; exit 1; }
          [[ "$WANT_SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "SHA-256 은 소문자 16진수 64자"; exit 1; }
          case "$MODE" in check|stage|publish) ;; *) echo "mode 는 check·stage·publish 가운데 하나"; exit 1;; esac
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"          # registry-url 은 주지 않음 — .npmrc 에 자리표 토큰이 생기지 않게(OIDC 로만)
      - name: npm 11.5.1+ (trusted publishing) · 11.21+ (stage)
        run: |
          set -euo pipefail
          if [ "$MODE" = stage ]; then npm install -g npm@^11.21.0; else npm install -g npm@^11.5.1; fi
          npm --version
      - name: Download the release tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dl && cd dl
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "$PKG-$VERSION.tgz" --pattern "SHA256SUMS_$VERSION.txt"
          ls -la
      - name: Verify fingerprint (input · release SHA256SUMS · main repository SHA256SUMS)
        run: |
          set -euo pipefail
          cd dl
          got=$(sha256sum "$PKG-$VERSION.tgz" | cut -d' ' -f1)
          echo "tgz SHA-256 $got"
          [ "$got" = "$WANT_SHA" ] || { echo "사람이 넣은 SHA-256 과 다름"; exit 1; }
          grep -qx "$got  $PKG-$VERSION.tgz" "SHA256SUMS_$VERSION.txt" || { echo "릴리스의 SHA256SUMS 와 다름"; exit 1; }
          curl -fsSL https://raw.githubusercontent.com/on-munseo/on-munseo.github.io/main/SHA256SUMS -o main_sums.txt
          if grep -q "  $PKG-$VERSION.tgz\$" main_sums.txt; then
            grep -qx "$got  $PKG-$VERSION.tgz" main_sums.txt || { echo "본 저장소 SHA256SUMS 와 다름"; exit 1; }
            echo "본 저장소 SHA256SUMS 와 같음"
          else
            echo "본 저장소 SHA256SUMS 에 아직 이 판 줄이 없음 — 사람이 넣은 값·릴리스 값 두 곳으로 확인함"
          fi
      - name: Check package.json inside the tarball
        run: |
          set -euo pipefail
          tar -xzOf "dl/$PKG-$VERSION.tgz" package/package.json > pkg.json
          node -e '
            const p = require("./pkg.json"), want = process.env.VERSION;
            const bad = [];
            if (p.name !== "on-munseo-local") bad.push("이름 " + p.name);
            if (p.version !== want) bad.push("판 " + p.version + " ≠ " + want);
            if (p.private) bad.push("private: true");
            const url = String((p.repository && p.repository.url) || "");
            if (!/^(git\+)?https:\/\/github\.com\/on-munseo\/on-local(\.git)?$/.test(url)) bad.push("repository.url " + url + " — 출처 증명은 이 저장소와 같아야 함");
            if (bad.length) { console.error("꾸러미 확인 실패: " + bad.join(" · ")); process.exit(1); }
            console.log("꾸러미 확인: " + p.name + "@" + p.version + " · " + url);
          '
          if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then echo "npm 에 이미 $PKG@$VERSION 이 있음 — 같은 판은 다시 못 올림"; exit 1; fi
      - name: Publish with provenance
        run: |
          set -euo pipefail
          f="./dl/$PKG-$VERSION.tgz"
          tag=(); [[ "$VERSION" == *-* ]] && tag=(--tag next)      # 미리 보는 판(1.2.3-beta.1)은 latest 가 아니라 next 로 — npm 11 은 태그를 꼭 달라고 함
          case "$MODE" in
            check)   npm publish "$f" --access public --dry-run ${tag[@]+"${tag[@]}"} ;;      # 검사만 — 출처 증명 서명(공개 기록)은 만들지 않음
            stage)   npm stage publish "$f" --provenance --access public ${tag[@]+"${tag[@]}"} ;;  # 승인: 맥에서 npm stage approve <id> (2단계 인증) — 처음엔 check 로 먼저
            publish) npm publish "$f" --provenance --access public ${tag[@]+"${tag[@]}"} ;;
          esac
      - name: After publishing — registry fingerprint and attestation
        if: ${{ inputs.mode != 'check' }}
        run: |
          set -euo pipefail
          want=$(node -e 'const c=require("crypto"),f=require("fs");console.log("sha512-"+c.createHash("sha512").update(f.readFileSync(process.argv[1])).digest("base64"))' "dl/$PKG-$VERSION.tgz")
          if [ "$MODE" = publish ]; then
            # npm 은 올린 뒤 몇 분 「처리 중」이라 바로 보이지 않음 — 최대 10분 기다림(11-27 0.3.0 때 20초로는 404)
            got=""
            for i in $(seq 1 40); do got=$(npm view "$PKG@$VERSION" dist.integrity 2>/dev/null || true); [ -n "$got" ] && break; sleep 15; done
            [ -n "$got" ] || { echo "10분 안에 npm 에 보이지 않음 — 나중에 npm view $PKG@$VERSION 로 확인"; exit 1; }
            [ "$got" = "$want" ] || { echo "npm 기록의 integrity 가 다름: $got"; exit 1; }
            npm view "$PKG@$VERSION" dist.attestations --json || true
            echo "확인: npm view $PKG@$VERSION dist.integrity = $got"
          else
            echo "단계 게시 — npmjs.com 에서 2단계 인증으로 승인하면 공개됨. 공개 뒤 integrity 는 $want 이어야 함"
          fi
